<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge</title>
<link rel="stylesheet" href="../../css/variables.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <style>
      :focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gl-focus-ring-inner-color), 0 0 0 4px var(--gl-focus-ring-outer-color); }
      .spin { animation: gl-spin .8s linear infinite; }
      @keyframes gl-spin { to { transform: rotate(360deg); } }
      .gl-tab-btn { position: relative; }
      .gl-tab-btn::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 1px; background-color: var(--gl-color-alpha-0); }
      .gl-tab-btn:hover::after { background-color: var(--gl-border-color-strong); }
      .gl-tab-btn[data-active='true'] { font-weight: var(--gl-font-weight-bold); }
      .gl-tab-btn[data-active='true']::after { background-color: var(--gl-tab-selected-indicator-color-default); }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
</head>
<body>
  <main class="max-w-3xl mx-auto my-8 px-8" style="color: var(--gl-text-color-default)">
    <h1 class="text-[length:var(--gl-heading-scale-500-font-size)] font-bold mb-4" style="color: var(--gl-text-color-heading)">Badge</h1>
    <p class="mb-6" style="color: var(--gl-text-color-subtle)">Pill capsules; variants, optional icon, link hover ring, disabled.</p>

    <div class="flex flex-wrap gap-3 mb-6">
      <span class="inline-flex items-center gap-2 rounded-[var(--gl-border-radius-full)] bg-[var(--gl-badge-neutral-background-color-default)] text-[color:var(--gl-badge-neutral-text-color-default)] px-[var(--gl-spacing-scale-2)] py-[var(--gl-spacing-scale-1)] text-[length:var(--gl-font-size-sm)] font-bold">neutral</span>
      <span class="inline-flex items-center gap-2 rounded-[var(--gl-border-radius-full)] bg-[var(--gl-badge-info-background-color-default)] text-[color:var(--gl-badge-info-text-color-default)] px-[var(--gl-spacing-scale-2)] py-[var(--gl-spacing-scale-1)] text-[length:var(--gl-font-size-sm)] font-bold">info</span>
      <span class="inline-flex items-center gap-2 rounded-[var(--gl-border-radius-full)] bg-[var(--gl-badge-success-background-color-default)] text-[color:var(--gl-badge-success-text-color-default)] px-[var(--gl-spacing-scale-2)] py-[var(--gl-spacing-scale-1)] text-[length:var(--gl-font-size-sm)] font-bold">success</span>
      <span class="inline-flex items-center gap-2 rounded-[var(--gl-border-radius-full)] bg-[var(--gl-badge-warning-background-color-default)] text-[color:var(--gl-badge-warning-text-color-default)] px-[var(--gl-spacing-scale-2)] py-[var(--gl-spacing-scale-1)] text-[length:var(--gl-font-size-sm)] font-bold">warning</span>
      <span class="inline-flex items-center gap-2 rounded-[var(--gl-border-radius-full)] bg-[var(--gl-badge-danger-background-color-default)] text-[color:var(--gl-badge-danger-text-color-default)] px-[var(--gl-spacing-scale-2)] py-[var(--gl-spacing-scale-1)] text-[length:var(--gl-font-size-sm)] font-bold">danger</span>
      <span class="inline-flex items-center gap-2 rounded-[var(--gl-border-radius-full)] bg-[var(--gl-badge-tier-background-color-default)] text-[color:var(--gl-badge-tier-text-color-default)] px-[var(--gl-spacing-scale-2)] py-[var(--gl-spacing-scale-1)] text-[length:var(--gl-font-size-sm)] font-bold">Premium</span>
    </div>

    <div class="flex flex-wrap gap-3 mb-6">
      <span class="inline-flex items-center gap-2 rounded-[var(--gl-border-radius-full)] bg-[var(--gl-badge-success-background-color-default)] text-[color:var(--gl-badge-success-text-color-default)] px-[var(--gl-spacing-scale-2)] py-[var(--gl-spacing-scale-1)] text-[length:var(--gl-font-size-sm)] font-bold"><svg class="gl-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8l3.5 3.5L13 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Passed</span>
      <span class="inline-flex items-center gap-2 rounded-[var(--gl-border-radius-full)] bg-[var(--gl-badge-danger-background-color-default)] text-[color:var(--gl-badge-danger-text-color-default)] px-[var(--gl-spacing-scale-2)] py-[var(--gl-spacing-scale-1)] text-[length:var(--gl-font-size-sm)] font-bold">undefined Failed</span>
      <span class="inline-flex items-center gap-2 rounded-[var(--gl-border-radius-full)] bg-[var(--gl-badge-info-background-color-default)] text-[color:var(--gl-badge-info-text-color-default)] px-[var(--gl-spacing-scale-2)] py-[var(--gl-spacing-scale-1)] text-[length:var(--gl-font-size-sm)] font-bold"><svg class="gl-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 11V7.5M8 5v.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> Info</span>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <a href="#" class="inline-flex items-center rounded-[var(--gl-border-radius-full)] bg-[var(--gl-badge-success-background-color-default)] text-[color:var(--gl-badge-success-text-color-default)] px-[var(--gl-spacing-scale-2)] py-[var(--gl-spacing-scale-1)] text-[length:var(--gl-font-size-sm)] font-bold no-underline hover:shadow-[inset_0_0_0_1px_var(--gl-border-color-strong)]">link badge</a>
      <span class="inline-flex items-center rounded-[var(--gl-border-radius-full)] bg-[var(--gl-badge-neutral-background-color-default)] text-[color:var(--gl-badge-neutral-text-color-default)] px-[var(--gl-spacing-scale-2)] py-[var(--gl-spacing-scale-1)] text-[length:var(--gl-font-size-sm)] font-bold opacity-[var(--gl-opacity-7)]">disabled state</span>
    </div>
  </main>
</body>
</html>
