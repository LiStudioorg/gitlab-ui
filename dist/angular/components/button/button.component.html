<!-- Pajamas-inspired (MIT) -->
<button
  type="button"
  class="gl-button"
  [ngStyle]="buttonStyle"
  [ngClass]="classes"
  [disabled]="isDisabled"
  [attr.aria-busy]="loading"
  (click)="onClick($event)"
>
  <span class="gl-button-spinner" *ngIf="loading" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2" opacity="0.35"/><path d="M14 8a6 6 0 0 0-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
  <span class="gl-button-icon" *ngIf="icon && !loading" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="3.5" fill="currentColor"/></svg></span>
  <span class="gl-button-text"><ng-content></ng-content></span>
</button>
